name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        English or Spanish are both fine. Before opening a request, check "Roadmap and Status" in the README:
        it may already be planned for a phase.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like Agent Studio to do. Screens, settings or examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: version
    attributes:
      label: Agent Studio version or commit you use
      placeholder: "v0.1.0-preview or d9ae1da"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 Pro 24H2, build 26100"
  - type: dropdown
    id: provider
    attributes:
      label: Provider CLI involved
      options:
        - None
        - Claude Code
        - Codex CLI
        - Both
        - Gemini CLI (parked)
  - type: input
    id: provider-version
    attributes:
      label: Provider CLI version
      placeholder: "claude 2.1.290, codex 0.160.0"
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to related issues, ADRs or documents.
